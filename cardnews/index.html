  │                                                              │
  │ 카드 종류(type)                                               │
  │   cover    표지 (전면 사진)                                   │
  │   location 위치·소개 (약도 + 정보 박스 2개)                    │

  │   split    위쪽 사진 + 아래 설명 + 태그                        │
  │   feature  위쪽 사진 + 아래 설명 + 특징 2칸                    │
  │   options  맞춤 옵션 4칸 + 아래 사진                           │
  │   gallery  사진 4장 모음 (items: photo·title·text)             │
  │   closing  마무리·문의 (전면 사진)                             │
  │                                                              │
  │ 정보 박스 아이콘(icon): bus subway car parking building pin    │
  │                         phone clock user video                │
  │ 사진 위치(position): "가로% 세로%" 예) "50% 78%"               │
  │ 마무리 연락처: brand.contact {type: instagram|store|phone}     │
  │ 로고 폭: brand.logoWidth (기본 18)                             │
  └──────────────────────────────────────────────────────────────┘
-->

<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  :root {
    --accent:#ff663b;
    --text-strong:#24272b; --text-body:#5f6772; --text-sub:#8a929c; --line:#e3e7ec;
    --on-dark-body:#d3d7da; --on-dark-sub:#a7afb6;
    --canvas:#f5f6f9;
    --ls-body:-.02em; --ls-head:-.04em;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:140px; }
  body { margin:0; color:var(--text-strong); background:#e8eaee; font-family:var(--font); letter-spacing:var(--ls-body); }
  button,input { font:inherit; letter-spacing:inherit; }

  /* ---------- 작업 화면 ---------- */
  .workspace { max-width:1560px; margin:auto; padding:25px 24px 45px; }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; margin-bottom:4px; background:#e8eaeef5; backdrop-filter:blur(12px); }
  .toolbar-title { font-size:15px; font-weight:800; }
  .toolbar-note { color:#667080; font-size:12px; margin-top:5px; }
  .controls { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  button,.color-control { border:1px solid #d4d8df; background:white; border-radius:9px; padding:9px 12px; color:#323a46; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { background:#26303f; color:white; border-color:#26303f; }
  .color-control { display:flex; align-items:center; gap:6px; }
  input[type=color] { width:21px; height:19px; border:0; padding:0; background:none; cursor:pointer; }
  .edit-help { display:none; }
  body.editing .view-help { display:none; }
  body.editing .edit-help { display:inline; }
  .slide-nav { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 22px; }
  .slide-nav a { border:1px solid #d3d7de; border-radius:20px; padding:7px 12px; font-size:11px; color:#5c6572; text-decoration:none; background:#f6f7f8; }
  .slide-nav a:hover { background:white; color:var(--accent); }
  .gallery { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:25px 20px; align-items:start; }
  .single-view .gallery { grid-template-columns:minmax(0,540px); justify-content:center; }
  .slide-frame { container-type:inline-size; min-width:0; }
  .slide-label { display:flex; align-items:center; gap:8px; font-size:11px; color:#939aa5; padding:10px 2px 0; font-weight:600; }
  .slide-label span { color:#656e7c; font-weight:400; }
  .jpg-one { margin-left:auto; padding:4px 9px; font-size:10px; border-radius:7px; }
  .source { margin:26px 0 0; text-align:center; font-size:11px; color:#747c89; line-height:1.7; }
  .source a { color:inherit; text-underline-offset:3px; }

  /* ---------- 카드 공통 ---------- */
  .card { position:relative; width:100%; aspect-ratio:4 / 5; overflow:hidden; background:var(--canvas); isolation:isolate; box-shadow:0 16px 55px #27324814; color:var(--text-strong); }
  .scene-photo { width:100%; height:100%; object-fit:cover; display:block; }
  .scene-photo.empty { background:repeating-linear-gradient(135deg,#3a4046 0 14px,#343a40 14px 28px); }
  .photo-bg { position:absolute; inset:0; z-index:-2; }
  .slide-top { position:absolute; left:5.2cqw; right:5.2cqw; top:4.2cqw; z-index:2; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .brand-mark { display:block; width:18cqw; height:auto; flex-shrink:0; filter:drop-shadow(0 1px 5px #0005); }
  .on-light .brand-mark { filter:brightness(0); }
  .slide-count { margin-left:auto; font-size:2.1cqw; padding:.65cqw 1.6cqw; border-radius:5cqw; letter-spacing:0; font-weight:600; background:#17202670; color:white; }
  .on-light .slide-count { background:#e1e4e9; color:#4f5663; }
  .dark { color:white; }
  .point-badge { display:inline-block; color:white; background:var(--accent); padding:.75cqw 1.8cqw; border-radius:2cqw; font-size:2.2cqw; font-weight:800; letter-spacing:0; }
  .eyebrow { display:flex; align-items:center; gap:.9cqw; color:var(--accent); font-size:2.2cqw; font-weight:800; letter-spacing:0; }
  .eyebrow svg { width:2.1cqw; height:2.5cqw; flex-shrink:0; fill:currentColor; }
  .title { font-size:5.6cqw; line-height:1.3; font-weight:800; letter-spacing:var(--ls-head); margin:2cqw 0 2.4cqw; word-break:keep-all; }
  .body { font-size:2.7cqw; line-height:1.8; margin:0; color:var(--text-body); word-break:keep-all; }
  .dark .body { color:var(--on-dark-body); }
  .tags { display:flex; flex-wrap:wrap; gap:1cqw; }
  .tags span { display:inline-block; padding:.7cqw 1.8cqw; font-size:2.2cqw; line-height:1.4; border-radius:5cqw; border:1px solid var(--line); background:white; color:var(--text-sub); }
  .dark .tags span { border-color:#ffffff50; background:#ffffff0c; color:white; }

  /* 표지 · 마무리 */
  .t-cover:after,.t-closing:after { content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(180deg,#0000004d 0%,#11191c20 22%,#11191c20 30%,#101619d9 69%,#101619 100%); }
  .cover-copy { position:absolute; left:5.2cqw; right:5.2cqw; bottom:5.2cqw; }
  .cover-kicker { font-size:3.6cqw; font-weight:600; margin:2.2cqw 0 2.3cqw; }
  .t-cover .title,.t-closing .title { font-size:7cqw; }
  .t-cover .title { margin:0 0 4.3cqw; }
  .cover-bottom { display:flex; justify-content:space-between; gap:10px; margin-top:5cqw; font-size:2.4cqw; color:var(--on-dark-body); }
  .cover-bottom strong { color:white; font-weight:800; }
  .closing-copy { position:absolute; left:6cqw; right:6cqw; bottom:7cqw; }
  .t-closing .title { margin:3cqw 0; }
  .instagram-card { display:flex; align-items:center; gap:2.3cqw; margin-top:5cqw; padding:3cqw 3.6cqw; border-radius:2cqw; color:white; background:var(--accent); font-size:3.4cqw; font-weight:800; letter-spacing:0; }
  .instagram-icon { display:block; width:4.8cqw; height:4.8cqw; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; }
  .instagram-dot { fill:currentColor; stroke:none; }
  .closing-note { font-size:2.2cqw; margin:3cqw 0 0; color:var(--on-dark-sub); }

  /* 전면 사진 + 설명 상자 */
  .t-photo:after { content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(180deg,#0000004d 0%,transparent 25%,transparent 45%,#0d1517 89%); }
  .photo-caption { position:absolute; left:4.4cqw; right:4.4cqw; bottom:4.4cqw; padding:3.6cqw; border:1px solid #ffffff13; border-radius:2.2cqw; background:linear-gradient(135deg,#1f2528d9,#13191cbd); }

  /* 위쪽 사진 + 아래 설명 */
  .top-photo { position:absolute; inset:0 0 auto; z-index:-1; }
  .top-photo:after { content:''; position:absolute; inset:0 0 -3px; pointer-events:none; background:linear-gradient(#0000004d,#00000000 22%,transparent 45%,#f5f6f9cc 80%,#f5f6f9 97%); }
  .t-split .top-photo { height:62%; }
  .t-feature .top-photo { height:58%; }
  .bottom-copy { position:absolute; left:5.3cqw; right:5.3cqw; bottom:5.3cqw; }
  .bottom-copy .body { margin-bottom:3.2cqw; }
  .mini-features { display:grid; grid-template-columns:1fr 1fr; gap:2cqw; }
  .mini-features div { background:white; padding:2.3cqw; border:1px solid var(--line); border-radius:1.7cqw; }
  .mini-features strong { display:block; font-size:2.7cqw; font-weight:600; }
  .mini-features span { display:block; margin-top:1cqw; color:var(--text-sub); font-size:2.2cqw; }

  /* 맞춤 옵션 */
  .options-copy { position:absolute; top:15cqw; left:5.3cqw; right:5.3cqw; }
  .options-copy .body { margin-bottom:3.2cqw; }
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:2cqw; }
  .options-grid div { padding:2.8cqw; background:white; border:1px solid var(--line); border-radius:1.8cqw; }
  .options-grid b { display:block; color:var(--accent); font-size:2cqw; font-weight:800; }
  .options-grid strong { display:block; font-size:3.6cqw; font-weight:600; margin:1cqw 0; }
  .options-grid small { display:block; font-size:2.2cqw; color:var(--text-sub); }
  .bottom-photo { position:absolute; left:5.3cqw; right:5.3cqw; bottom:5.3cqw; height:28cqw; border-radius:2cqw; overflow:hidden; }

  /* 사진 모음 (2×2) */
  .gallery-copy { position:absolute; top:13.5cqw; left:5.3cqw; right:5.3cqw; }
  .photo-grid { position:absolute; left:5.3cqw; right:5.3cqw; bottom:5.3cqw; display:grid; grid-template-columns:1fr 1fr; gap:2cqw; }
  .photo-grid figure { margin:0; background:white; border:1px solid var(--line); border-radius:1.8cqw; overflow:hidden; }
  .photo-grid .cell { aspect-ratio:16 / 9; overflow:hidden; }
  .photo-grid figcaption { padding:1.7cqw 2.2cqw 1.9cqw; }
  .photo-grid strong { display:block; font-size:2.5cqw; font-weight:600; line-height:1.4; }
  .photo-grid figcaption span { display:block; font-size:2cqw; line-height:1.4; color:var(--text-sub); margin-top:.3cqw; }

  /* 위치 */
  .t-location { padding:4.2cqw 5.2cqw 5.2cqw; display:flex; flex-direction:column; }
  .t-location .slide-top { position:static; margin-bottom:2.8cqw; }
  .map { width:100%; aspect-ratio:490 / 278; border-radius:2.8cqw; overflow:hidden; background:#f1ede5; flex-shrink:0; }
  .map svg { width:100%; height:100%; display:block; font-family:inherit; }
  .map svg text { letter-spacing:var(--ls-body); }
  .accent-fill { fill:var(--accent); }
  .accent-stroke { stroke:var(--accent); }
  .info { margin-top:2.2cqw; padding:3.6cqw 4cqw 3.8cqw; border-radius:2.8cqw; background:white; box-shadow:0 5px 15px #303d5510; flex:1; display:flex; flex-direction:column; }
  .info .title { margin:1.6cqw 0 2cqw; }
  .features { margin-top:auto; padding-top:2.6cqw; display:grid; grid-template-columns:1fr 1fr; gap:2cqw; }
  .feature { display:flex; align-items:center; gap:2.2cqw; min-width:0; padding:2.1cqw 2.4cqw; border-radius:1.8cqw; background:var(--canvas); border:1px solid var(--line); }
  .feature-icon { flex-shrink:0; display:grid; place-items:center; width:6.4cqw; height:6.4cqw; border-radius:1.6cqw; background:#fff4ed; color:var(--accent); }
  .feature-icon svg { width:3.8cqw; height:3.8cqw; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .feature strong { display:block; font-size:2.7cqw; line-height:1.45; font-weight:600; }
  .feature small { display:block; font-size:2.2cqw; line-height:1.45; margin-top:.4cqw; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- 편집 모드 ---------- */
  body.editing [data-path] { outline:1px dashed #ff663b80; outline-offset:2px; border-radius:2px; cursor:text; }
  body.editing [data-path]:focus { outline:2px solid var(--accent); background:#fff9ed; color:var(--text-strong); }
  body.editing [data-photo] { cursor:grab; }
  body.editing .map { outline:1px dashed #9ca9b8; cursor:copy; }
  body.editing .card { overflow:visible; }

  /* ---------- JPG 저장 창 ---------- */
  .export-stage { position:fixed; left:-20000px; top:0; width:1080px; pointer-events:none; }
  .export-stage .card { box-shadow:none; }
  .export-modal { position:fixed; inset:0; z-index:50; background:#10161acc; display:flex; align-items:center; justify-content:center; padding:16px; }
  .export-modal[hidden] { display:none; }
  .export-panel { background:white; border-radius:14px; width:min(920px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:18px; }
  .export-head { display:flex; align-items:center; gap:10px; }
  .export-head strong { font-size:15px; font-weight:800; }
  .export-status { font-size:12px; color:var(--text-sub); }
  .export-close { margin-left:auto; }
  .export-tip { font-size:12px; color:var(--text-body); line-height:1.6; margin:8px 0 12px; }
  .export-actions { display:flex; gap:7px; margin-bottom:12px; }
  .export-actions button { background:var(--accent); border-color:var(--accent); color:white; }
  .export-actions button[hidden] { display:none; }
  .export-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .export-grid figure { margin:0; }
  .export-grid img { width:100%; display:block; border-radius:6px; box-shadow:0 2px 8px #0002; }
  .export-grid a { display:block; text-align:center; font-size:12px; font-weight:600; color:var(--text-strong); padding:6px 0 0; }

  @media(max-width:1050px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } .toolbar { align-items:flex-start; flex-direction:column; gap:12px; } }
  @media(max-width:650px) {
    .workspace { padding:10px 12px 30px; }
    .gallery { grid-template-columns:minmax(0,540px); justify-content:center; gap:22px; }
    .toolbar { padding:9px 0; }
    .controls { gap:5px; }
    .controls button,.color-control { font-size:11px; padding:8px 9px; }
    .slide-nav { gap:5px; margin-bottom:16px; }
    .slide-nav a { padding:5px 9px; font-size:10px; }
    .source { font-size:10px; }
  }
  @media print {
    @page { size:148mm 185mm; margin:0; }
    body { background:white; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .toolbar,.slide-nav,.source,.slide-label,.export-modal { display:none!important; }
    .workspace { max-width:none; padding:0; }
    .gallery { display:block; }
    .slide-frame { width:148mm; break-after:page; }
    .slide-frame:last-child { break-after:auto; }
    .card { width:148mm; height:185mm; box-shadow:none; }
  }
</style>
</head>
<body class="single-view">
<main class="workspace">
  <header class="toolbar" aria-label="카드 편집 도구">
    <div>
      <div class="toolbar-title" id="toolbar-title"></div>
      <div class="toolbar-note"><span class="view-help">편집을 켜면 화면에서 바로 문구를 고칠 수 있어요.</span><span class="edit-help">글자 클릭 수정 · 사진 끌어서 위치 조정 · 사진/약도 더블클릭으로 교체</span></div>
    </div>
    <div class="controls">
      <button id="edit-toggle" type="button" aria-pressed="false">편집 켜기</button>
      <label class="color-control">강조색 <input id="accent-color" type="color" aria-label="강조색"></label>
      <button id="view-toggle" type="button" aria-pressed="true">전체 모아보기</button>
      <button id="save-jpg" type="button">JPG 저장</button>
      <button id="save-html" type="button">HTML 저장</button>
    </div>
  </header>
  <nav class="slide-nav" id="slide-nav" aria-label="카드 바로가기"></nav>
  <div class="gallery" id="gallery"></div>
  <p class="source" id="source"></p>
  <div class="export-modal" hidden>
    <div class="export-panel" role="dialog" aria-label="JPG 저장">
      <div class="export-head"><strong>JPG 저장</strong><span class="export-status"></span><button class="export-close" type="button">닫기</button></div>
      <p class="export-tip">인스타 규격 1080×1350으로 저장돼요. PC는 '저장'이나 '전체 다운로드', 휴대폰은 '공유·사진에 저장'을 누르거나 이미지를 길게 눌러 저장하세요.</p>
      <div class="export-actions"><button id="export-share" type="button" hidden>공유·사진에 저장</button><button id="export-all" type="button" hidden>전체 다운로드</button></div>
      <div class="export-grid"></div>
    </div>
  </div>
</main>

<script>
/* =============================================================
   카드 렌더러 : 데이터(cardnews-data) + 사진 보관함(cardnews-assets) → 카드
   ============================================================= */
const data = JSON.parse(document.getElementById('cardnews-data').textContent);
let assets = {}; // 파일 맨 아래 사진 보관함에서 읽어 옴

const ICONS = {
  bus:'<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M8 7h8M8 11h8M8 18v3m8-3v3M8 15h1m6 0h1"/>',
  subway:'<rect x="6" y="3" width="12" height="14" rx="4"/><path d="M9 21l2-4m4 4-2-4M6 11h12M9 14h.01M15 14h.01"/>',
  car:'<path d="M5 16V11l2-5h10l2 5v5M4 16h16M7 19v-3m10 3v-3M5 11h14M8 13.5h.01M16 13.5h.01"/>',
  parking:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',
  building:'<path d="M5 21V4h14v17M3 21h18M9 8h1m4 0h1m-6 4h1m4 0h1m-5 9v-5h4v5"/>',
  pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  user:'<circle cx="12" cy="6" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3M3 11l3 3m15-3-3 3"/>',
  video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',
};
const PIN = '<svg viewBox="0 0 16 20" aria-hidden="true"><path d="M8 0a8 8 0 0 0-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 0 0-8-8zm0 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8"/></svg>';
const CONTACT_ICONS = {
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="instagram-dot" cx="17.5" cy="6.5" r="1"/>',
  store:'<path d="M4 8h16l-1.2 11.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1"/>',
};
function contactCard() {
  // brand.contact = { type:'instagram'|'store'|'phone', text } (없으면 brand.instagram 사용)
  const c = data.brand.contact;
  const type = c?.type || 'instagram';
  const path = c ? 'brand.contact.text' : 'brand.instagram';
  const text = c ? c.text : data.brand.instagram;
  return `<div class="instagram-card"><svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">${CONTACT_ICONS[type] || CONTACT_ICONS.instagram}</svg>${field('span', '', path, text)}</div>`;
}

const esc = value => String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines = value => esc(value).replace(/\n/g, '<br>');
const pad = n => String(n).padStart(2, '0');

/* 편집 가능한 글자 : data-path 로 데이터 위치를 기억 */
function field(tag, cls, path, value) {
  return `<${tag}${cls ? ` class="${cls}"` : ''} data-path="${path}">${lines(value)}</${tag}>`;
}
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function photo(path, item) {
  const src = assets[item.photo] || BLANK;
  const empty = assets[item.photo] ? '' : ' empty';
  const pos = item.position || '50% 50%';
  return `<img class="scene-photo${empty}" src="${src}" alt="${esc(item.alt || '')}" style="object-position:${esc(pos)}" data-photo="${path}" draggable="false">`;
}
function slideTop(slideIndex, total) {
  const logo = assets[data.brand.logo] ? `<img class="brand-mark" src="${assets[data.brand.logo]}" alt="${esc(data.brand.name)}" style="width:${Number(data.brand.logoWidth) || 18}cqw">` : '';
  return `<header class="slide-top">${logo}<span class="slide-count">${pad(slideIndex + 1)} / ${pad(total)}</span></header>`;
}

const LAYOUTS = {
  cover: (s, i, p, n) => ({ cls:'dark', html:`
    <div class="photo-bg">${photo(p, s)}</div>${slideTop(i, n)}
    <div class="cover-copy">
      ${field('span', 'point-badge', `${p}.badge`, s.badge)}
      ${field('p', 'cover-kicker', `${p}.kicker`, s.kicker)}
      ${field('h1', 'title', `${p}.title`, s.title)}
      <div class="tags">${(s.tags || []).map((t, k) => field('span', '', `${p}.tags.${k}`, t)).join('')}</div>
      <div class="cover-bottom">${field('span', '', `${p}.footer`, s.footer)}${field('strong', '', `${p}.next`, s.next)}</div>
    </div>` }),

  location: (s, i, p, n) => {
    const map = assets[s.map] || '';
    const mapHTML = map.startsWith('data:') ? `<img class="scene-photo" src="${map}" alt="${esc(s.mapAlt || '')}">` : map;
    return { cls:'on-light', html:`
    ${slideTop(i, n)}
    <section class="map" data-map="${i}" aria-label="${esc(s.mapAlt || '위치 약도')}">${mapHTML}</section>
    <section class="info">
      <div class="eyebrow">${PIN}${field('span', '', `${p}.eyebrow`, s.eyebrow)}</div>
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
      <div class="features">${(s.features || []).slice(0, 2).map((f, k) => `
        <div class="feature"><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[f.icon] || ICONS.pin}</svg></span>
        <div style="min-width:0">${field('strong', '', `${p}.features.${k}.title`, f.title)}${field('small', '', `${p}.features.${k}.text`, f.text)}</div></div>`).join('')}
      </div>
    </section>` };
  },

  photo: (s, i, p, n) => ({ cls:'dark', html:`
    <div class="photo-bg">${photo(p, s)}</div>${slideTop(i, n)}
    <div class="photo-caption">
      ${field('span', 'point-badge', `${p}.badge`, s.badge)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
    </div>` }),

  split: (s, i, p, n) => ({ cls:'', html:`
    <div class="top-photo">${photo(p, s)}</div>${slideTop(i, n)}
    <div class="bottom-copy">
      ${field('span', 'eyebrow', `${p}.eyebrow`, s.eyebrow)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
      <div class="tags">${(s.tags || []).map((t, k) => field('span', '', `${p}.tags.${k}`, t)).join('')}</div>
    </div>` }),

  feature: (s, i, p, n) => ({ cls:'', html:`
    <div class="top-photo">${photo(p, s)}</div>${slideTop(i, n)}
    <div class="bottom-copy">
      ${field('span', 'eyebrow', `${p}.eyebrow`, s.eyebrow)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
      <div class="mini-features">${(s.points || []).slice(0, 2).map((f, k) => `<div>${field('strong', '', `${p}.points.${k}.title`, f.title)}${field('span', '', `${p}.points.${k}.text`, f.text)}</div>`).join('')}</div>
    </div>` }),

  options: (s, i, p, n) => ({ cls:'on-light', html:`
    ${slideTop(i, n)}
    <div class="options-copy">
      ${field('span', 'eyebrow', `${p}.eyebrow`, s.eyebrow)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
      <div class="options-grid">${(s.options || []).slice(0, 4).map((o, k) => `<div><b>${pad(k + 1)}</b>${field('strong', '', `${p}.options.${k}.title`, o.title)}${field('small', '', `${p}.options.${k}.text`, o.text)}</div>`).join('')}</div>
    </div>
    <div class="bottom-photo">${photo(p, s)}</div>` }),

  gallery: (s, i, p, n) => ({ cls:'on-light', html:`
    ${slideTop(i, n)}
    <div class="gallery-copy">
      ${field('span', 'eyebrow', `${p}.eyebrow`, s.eyebrow)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${s.body ? field('p', 'body', `${p}.body`, s.body) : ''}
    </div>
    <div class="photo-grid">${(s.items || []).slice(0, 4).map((item, k) => `
      <figure><div class="cell">${photo(`${p}.items.${k}`, item)}</div>
      <figcaption>${field('strong', '', `${p}.items.${k}.title`, item.title)}${field('span', '', `${p}.items.${k}.text`, item.text)}</figcaption></figure>`).join('')}
    </div>` }),

  closing: (s, i, p, n) => ({ cls:'dark', html:`
    <div class="photo-bg">${photo(p, s)}</div>${slideTop(i, n)}
    <div class="closing-copy">
      ${field('span', 'point-badge', `${p}.badge`, s.badge)}
      ${field('h2', 'title', `${p}.title`, s.title)}
      ${field('p', 'body', `${p}.body`, s.body)}
      ${contactCard()}
      ${field('p', 'closing-note', `${p}.note`, s.note)}
    </div>` }),
};

function render() {
  const total = data.slides.length;
  document.title = data.meta.title;
  document.getElementById('toolbar-title').textContent = `${data.meta.title} · ${total}장`;
  document.documentElement.style.setProperty('--accent', data.theme.accent);
  document.getElementById('accent-color').value = data.theme.accent;
  document.getElementById('slide-nav').innerHTML = data.slides.map((s, i) => `<a href="#slide-${i + 1}">${pad(i + 1)} ${esc(s.name)}</a>`).join('');
  document.getElementById('gallery').innerHTML = data.slides.map((s, i) => {
    const layout = LAYOUTS[s.type];
    if (!layout) return `<section class="slide-frame"><p>알 수 없는 카드 종류: ${esc(s.type)}</p></section>`;
    const { cls, html } = layout(s, i, `slides.${i}`, total);
    return `<section class="slide-frame" id="slide-${i + 1}">
      <article class="card t-${s.type} ${cls}" aria-label="${i + 1}번째 카드: ${esc(s.name)}">${html}</article>
      <div class="slide-label">${pad(i + 1)} <span>${esc(s.name)}</span><button class="jpg-one" type="button" data-index="${i}">JPG</button></div>
    </section>`;
  }).join('');
  const src = data.meta.source;
  document.getElementById('source').innerHTML = src ? `내용 출처: <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.label)}</a> · ${esc(src.date)}` : '';
  if (editing) setEditable(true);
}

/* =============================================================
   편집 : 화면에서 고친 글자는 데이터에 바로 반영
   ============================================================= */
let editing = false;
const editToggle = document.getElementById('edit-toggle');

function getPath(path) { return path.split('.').reduce((o, k) => o?.[k], data); }
function setPath(path, value) {
  const keys = path.split('.'); const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], data);
  target[last] = value;
}
function setEditable(enabled) {
  document.querySelectorAll('[data-path]').forEach(el => el.setAttribute('contenteditable', enabled ? 'plaintext-only' : 'false'));
  // plaintext-only를 지원하지 않는 브라우저 대비
  if (enabled) document.querySelectorAll('[data-path]').forEach(el => { if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true'; });
}
function setEditing(enabled) {
  editing = enabled;
  document.body.classList.toggle('editing', enabled);
  editToggle.setAttribute('aria-pressed', String(enabled));
  editToggle.textContent = enabled ? '편집 끝내기' : '편집 켜기';
  setEditable(enabled);
}
editToggle.addEventListener('click', () => setEditing(!editing));

document.addEventListener('input', event => {
  const el = event.target.closest?.('[data-path]');
  if (!el || !editing) return;
  const text = el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  setPath(el.dataset.path, text);
  // 같은 데이터를 쓰는 다른 곳(예: 인스타 계정)도 맞춰 줌
  document.querySelectorAll(`[data-path="${el.dataset.path}"]`).forEach(other => { if (other !== el) other.innerHTML = lines(text); });
});
document.addEventListener('keydown', event => {
  if (!editing || event.key !== 'Enter' || event.isComposing || !event.target.closest?.('[data-path]')) return;
  event.preventDefault();
  document.execCommand('insertLineBreak');
});
document.addEventListener('paste', event => {
  if (!editing || !event.target.closest?.('[data-path]')) return;
  event.preventDefault();
  document.execCommand('insertText', false, event.clipboardData.getData('text/plain'));
});

document.getElementById('accent-color').addEventListener('input', event => {
  data.theme.accent = event.target.value;
  document.documentElement.style.setProperty('--accent', data.theme.accent);
});
const viewToggle = document.getElementById('view-toggle');
viewToggle.addEventListener('click', () => {
  const single = document.body.classList.toggle('single-view');
  viewToggle.setAttribute('aria-pressed', String(single));
  viewToggle.textContent = single ? '전체 모아보기' : '한 장씩 보기';
});

/* 사진 : 끌어서 위치 조정, 더블클릭으로 교체 (사진은 최대 1600px로 줄여서 보관) */
function pickImage() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.addEventListener('change', () => {
      const file = input.files[0]; if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', .86));
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    input.click();
  });
}
function newAssetKey(prefix) { let n = 1; while (assets[`${prefix}-${n}`]) n++; return `${prefix}-${n}`; }

document.addEventListener('dblclick', async event => {
  if (!editing) return;
  const img = event.target.closest('[data-photo]');
  const map = event.target.closest('[data-map]');
  if (!img && !map) return;
  const url = await pickImage(); if (!url) return;
  if (img) {
    const item = getPath(img.dataset.photo);
    const key = newAssetKey('photo'); assets[key] = url;
    item.photo = key; item.position = '50% 50%';
  } else {
    const slide = data.slides[map.dataset.map];
    const key = newAssetKey('map'); assets[key] = url; slide.map = key;
  }
  render();
});

let drag = null;
document.addEventListener('pointerdown', event => {
  const img = event.target.closest?.('[data-photo]');
  if (!editing || !img || event.button !== 0) return;
  const item = getPath(img.dataset.photo);
  const [x, y] = (item.position || '50% 50%').split(/\s+/).map(parseFloat);
  const box = img.getBoundingClientRect();
  drag = { img, slide:item, key:'position', x, y, startX:event.clientX, startY:event.clientY, w:box.width, h:box.height };
  img.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove', event => {
  if (!drag) return;
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const x = clamp(drag.x - (event.clientX - drag.startX) / drag.w * 150);
  const y = clamp(drag.y - (event.clientY - drag.startY) / drag.h * 150);
  drag.slide[drag.key] = `${x}% ${y}%`;
  drag.img.style.objectPosition = drag.slide[drag.key];
});
document.addEventListener('pointerup', () => { drag = null; });
document.addEventListener('pointercancel', () => { drag = null; });

/* =============================================================
   HTML 저장 : 화면이 아니라 '데이터 + 사진'을 파일에 다시 써 넣음
   ============================================================= */
let fileHandle = null;
function usedAssets() {
  const keep = {}; const use = key => { if (key && assets[key]) keep[key] = assets[key]; };
  use(data.brand.logo);
  data.slides.forEach(s => { use(s.photo); use(s.map); (s.items || []).forEach(item => use(item.photo)); });
  return keep;
}
function buildHTML() {
  const json = value => value.replace(/</g, '\\u003c');
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#gallery').innerHTML = '';
  clone.querySelector('#slide-nav').innerHTML = '';
  clone.querySelector('#source').innerHTML = '';
  clone.querySelector('#toolbar-title').textContent = '';
  clone.querySelector('.export-grid').innerHTML = '';
  clone.querySelector('.export-status').textContent = '';
  clone.querySelector('.export-modal').setAttribute('hidden', '');
  clone.querySelectorAll('.export-stage').forEach(el => el.remove());
  clone.removeAttribute('style');
  const body = clone.querySelector('body');
  body.classList.remove('editing');
  const edit = clone.querySelector('#edit-toggle');
  edit.setAttribute('aria-pressed', 'false'); edit.textContent = '편집 켜기';
  clone.querySelector('#save-html').textContent = 'HTML 저장';
  clone.querySelector('#cardnews-data').textContent = '\n' + json(JSON.stringify(data, null, 2)) + '\n';
  clone.querySelector('#cardnews-assets').textContent = json(JSON.stringify(usedAssets()));
  return '<!doctype html>\n' + clone.outerHTML;
}
document.getElementById('save-html').addEventListener('click', async () => {
  const button = document.getElementById('save-html');
  const html = buildHTML();
  const name = `${data.meta.fileName || 'cardnews'}.html`;
  try {
    if (window.showSaveFilePicker) {
      // 크롬·엣지(PC): 처음 한 번 위치를 고르면 이후엔 같은 파일에 덮어쓰기
      fileHandle ??= await window.showSaveFilePicker({ suggestedName:name, types:[{ description:'HTML', accept:{ 'text/html':['.html'] } }] });
      const writable = await fileHandle.createWritable();
      await writable.write(html); await writable.close();
      button.textContent = '저장됨 ✓';
      setTimeout(() => { button.textContent = 'HTML 저장'; }, 1600);
      return;
    }
  } catch (error) {
    if (error.name === 'AbortError') return;
    console.warn(error);
  }
  const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
  const link = document.createElement('a'); link.href = url; link.download = name; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* =============================================================
   JPG 저장 : 실제 1080px 폭으로 다시 배치해서 촬영
   ============================================================= */
const exportModal = document.querySelector('.export-modal');
const exportGrid = exportModal.querySelector('.export-grid');
const exportStatus = exportModal.querySelector('.export-status');
const shareButton = document.getElementById('export-share');
const allButton = document.getElementById('export-all');
const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let exported = [];
let fontCSS = null;
let exporting = false;

async function renderCard(card) {
  if (fontCSS === null) {
    try { fontCSS = await htmlToImage.getFontEmbedCSS(document.body); } catch (error) { fontCSS = ''; }
  }
  const stage = document.createElement('div');
  stage.className = 'slide-frame export-stage';
  const copy = card.cloneNode(true);
  copy.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
  stage.append(copy);
  document.body.append(stage);
  try {
    await Promise.all([...copy.querySelectorAll('img')].map(image => image.decode().catch(() => {})));
    const options = { pixelRatio:1, backgroundColor:'#f5f6f9', fontEmbedCSS:fontCSS };
    if (isIOS) await htmlToImage.toCanvas(copy, options); // iOS 첫 렌더에서 사진이 빠지는 문제 예방
    const canvas = await htmlToImage.toCanvas(copy, options);
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .92));
  } finally {
    stage.remove();
  }
}

async function exportCards(indexes) {
  if (exporting) return;
  if (!window.htmlToImage) { alert('이미지 저장 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'); return; }
  exporting = true;
  exported.forEach(item => URL.revokeObjectURL(item.url));
  exported = [];
  exportGrid.innerHTML = '';
  shareButton.hidden = allButton.hidden = true;
  exportModal.hidden = false;
  const wasEditing = editing;
  if (wasEditing) setEditing(false);
  document.activeElement?.blur();
  await document.fonts.ready;
  const cards = [...document.querySelectorAll('#gallery .card')];
  try {
    for (const [step, index] of indexes.entries()) {
      exportStatus.textContent = `만드는 중… ${step + 1} / ${indexes.length}`;
      const blob = await renderCard(cards[index]);
      const name = `${data.meta.fileName || 'card'}-${pad(index + 1)}.jpg`;
      const url = URL.createObjectURL(blob);
      exported.push({ name, blob, url });
      const figure = document.createElement('figure');
      figure.innerHTML = `<img alt="${index + 1}번 카드"><a>${pad(index + 1)} 저장</a>`;
      figure.querySelector('img').src = url;
      figure.querySelector('a').href = url;
      figure.querySelector('a').download = name;
      exportGrid.append(figure);
    }
    exportStatus.textContent = `완료 · ${exported.length}장`;
  } catch (error) {
    console.error(error);
    exportStatus.textContent = '저장 중 문제가 생겼어요: ' + (error?.message || error);
  } finally {
    if (wasEditing) setEditing(true);
    exporting = false;
  }
  const files = exported.map(item => new File([item.blob], item.name, { type:'image/jpeg' }));
  shareButton.hidden = !(files.length && navigator.canShare && navigator.canShare({ files }));
  allButton.hidden = exported.length < 2;
}

document.getElementById('save-jpg').addEventListener('click', () => exportCards(data.slides.map((_, i) => i)));
document.addEventListener('click', event => {
  const button = event.target.closest?.('.jpg-one');
  if (button) exportCards([Number(button.dataset.index)]);
});
exportModal.querySelector('.export-close').addEventListener('click', () => { exportModal.hidden = true; });
exportModal.addEventListener('click', event => { if (event.target === exportModal) exportModal.hidden = true; });
shareButton.addEventListener('click', () => {
  const files = exported.map(item => new File([item.blob], item.name, { type:'image/jpeg' }));
  navigator.share({ files, title:data.meta.title }).catch(() => {});
});
allButton.addEventListener('click', async () => {
  for (const item of exported) {
    const link = document.createElement('a'); link.href = item.url; link.download = item.name; link.click();
    await new Promise(resolve => setTimeout(resolve, 400));
  }
});

document.addEventListener('DOMContentLoaded', () => {
  assets = JSON.parse(document.getElementById('cardnews-assets').textContent);
  render();
});
</script>
